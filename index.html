<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="theme-color" content="#f8cffc">
		<title>Mateo Wang</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Victor+Mono:wght@700&display=swap" rel="stylesheet">
		<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background-color: #f8cffc;
			height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 48px 16px 0;
			font-family: "Victor Mono", monospace;
			color: #fb5a28;
		}

		/* The area the squircle outlines: 3vh below the subtitle, 3vh above the
		   footer (68px tall), 20vw in from each side */
		.stage {
			position: relative;
			flex: 1;
			min-height: 0;
			width: 60vw;
			margin: 3vh 0 calc(68px + 3vh);
		}

		.squircle {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 3;
			overflow: visible;
			pointer-events: none;
		}

		.squircle > path {
			fill: none;
			stroke: #fb5a28;
			stroke-width: 4;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.wordmark {
			display: block;
			width: 280px;
			max-width: calc(100vw - 32px);
			height: auto;
		}

		.subtitle {
			margin-top: 16px;
			font-size: 14px;
			font-weight: 700;
			text-align: center;
		}
		.trinkets {
			position: fixed;
			top: 0;
			bottom: 0;
			width: 20vw;
			display: flex;
			flex-direction: column;
			justify-content: space-evenly;
			align-items: center;
			padding: 3vh 0;
			pointer-events: none;
		}

		.trinkets-left {
			left: 0;
		}

		.trinkets-right {
			right: 0;
		}

		.trinkets img {
			display: block;
			width: auto;
			height: auto;
			max-width: 12vw;
			max-height: 18vh;
			animation: wiggle 0.5s steps(1) infinite;
		}

		.trinkets img.cutout {
			max-width: 8vw;
			max-height: 12vh;
		}

		.cutouts {
			position: absolute;
			top: 5%;
			bottom: 5%;
			width: 15%;
			z-index: 4;
			display: flex;
			flex-direction: column;
			justify-content: space-around;
			align-items: center;
			pointer-events: none;
		}

		.cutouts-left {
			left: 3%;
		}

		.cutouts-right {
			right: 3%;
		}

		.temp-filler {
			position: absolute;
			top: 50%;
			left: 50%;
			z-index: 1;
			width: 100%;
			height: 100%;
			border-radius: 30%;
			transform: translate(-50%, -50%);
			object-fit: cover;
			pointer-events: none;
		}

		.cutouts img {
			display: block;
			width: auto;
			height: auto;
			max-width: 100%;
			max-height: 20%;
			animation: wiggle 0.5s steps(1) infinite;
		}

		/* Boiling-line wiggle: hop between three slightly different distortions */
		@keyframes wiggle {
			0% {
				filter: url(#wiggle-1);
			}
			33% {
				filter: url(#wiggle-2);
			}
			66% {
				filter: url(#wiggle-3);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.trinkets img {
				animation: none;
			}
		}

		.footer {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			display: flex;
			justify-content: center;
			gap: 24px;
			padding: 20px 16px;
		}

		.footer-link {
			display: block;
			width: 28px;
			height: 28px;
			color: #fb5a28;
		}

		@media (max-width: 640px) {
			body {
				height: auto;
				min-height: 100vh;
			}

			.stage {
				flex: none;
				width: 100%;
				height: 60vh;
				margin: 3vh 0;
			}

			.trinkets {
				position: static;
				width: 100%;
				flex-direction: row;
				padding: 0;
				margin-top: 3vh;
			}

			.trinkets img {
				max-width: 17vw;
				max-height: 17vw;
			}

			.trinkets img.cutout {
				max-width: 7vw;
				max-height: 7vw;
			}

			.cutouts {
				top: 4%;
				bottom: 4%;
				width: 18%;
			}

			.cutouts img {
				max-width: 70%;
				max-height: 18vw;
			}

			.temp-filler {
				width: 35%;
				max-height: 35%;
			}

			.footer {
				position: static;
				margin-top: 3vh;
			}
		}

		.footer-link svg {
			width: 100%;
			height: 100%;
			fill: currentColor;
		}
		</style>
	</head>

		<script>
		// Hand-drawn squircle around .stage. The wobble is a fixed function of
		// position along the outline, so it holds still and only reshapes when
		// the stage resizes.
		const stage = document.querySelector(".stage");
		const squirclePath = document.getElementById("squircle-path");

		function drawSquircle() {
			const x0 = 0;
			const y0 = 0;
			const w = stage.clientWidth;
			const h = stage.clientHeight;
			const r = Math.min(w, h) * 0.3;
			const n = 4; // superellipse exponent for the corners

			// Outline as a list of points: straight edges plus superellipse corners
			const outline = [];
			const corner = (cx, cy, startAngle) => {
				for (let i = 0; i <= 24; i++) {
					const a = startAngle + (i / 24) * (Math.PI / 2);
					const c = Math.cos(a);
					const s = Math.sin(a);
					outline.push([
						cx + r * Math.sign(c) * Math.abs(c) ** (2 / n),
						cy + r * Math.sign(s) * Math.abs(s) ** (2 / n),
					]);
				}
			};
			corner(x0 + w - r, y0 + r, -Math.PI / 2);
			corner(x0 + w - r, y0 + h - r, 0);
			corner(x0 + r, y0 + h - r, Math.PI / 2);
			corner(x0 + r, y0 + r, Math.PI);
			outline.push(outline[0]);

			// Cumulative length, for sampling evenly by distance
			const lengths = [0];
			for (let i = 1; i < outline.length; i++) {
				const [ax, ay] = outline[i - 1];
				const [bx, by] = outline[i];
				lengths.push(lengths[i - 1] + Math.hypot(bx - ax, by - ay));
			}
			const total = lengths[lengths.length - 1];
			// Start the stroke at the bottom-left, away from the wordmark
			const start = lengths[50];

			const pointAt = (d) => {
				d = ((d % total) + total) % total;
				let i = 1;
				while (lengths[i] < d) i++;
				const t = (d - lengths[i - 1]) / (lengths[i] - lengths[i - 1] || 1);
				const [ax, ay] = outline[i - 1];
				const [bx, by] = outline[i];
				return [ax + (bx - ax) * t, ay + (by - ay) * t];
			};

			const wobble = (t) =>
				4.5 * Math.sin(2 * Math.PI * 2 * t + 0.7) +
				3.2 * Math.sin(2 * Math.PI * 5 * t + 2.1) +
				2.2 * Math.sin(2 * Math.PI * 9 * t + 4.4) +
				1.4 * Math.sin(2 * Math.PI * 17 * t + 1.3) +
				0.8 * Math.sin(2 * Math.PI * 29 * t + 5.2);

			// Sample a little past the start so the line overlaps itself, drifting
			// outward as it goes, like a pen that doesn't land where it began
			const overlap = 0.04;
			const count = Math.max(48, Math.round(total / 14));
			const points = [];
			for (let i = 0; i <= count * (1 + overlap); i++) {
				const t = i / count;
				const [px, py] = pointAt(start + t * total);
				const [qx, qy] = pointAt(start + t * total + 1);
				const len = Math.hypot(qx - px, qy - py) || 1;
				const nx = (qy - py) / len;
				const ny = -(qx - px) / len;
				const off = wobble(t) + 5 * Math.max(0, t - 1) / overlap;
				points.push([px + nx * off, py + ny * off]);
			}

			// Catmull-Rom through the points, as cubic Beziers.
			const pathFromPoints = (pathPoints) => {
				let pathD = `M${pathPoints[0][0].toFixed(1)},${pathPoints[0][1].toFixed(1)}`;
				for (let i = 0; i < pathPoints.length - 1; i++) {
					const p0 = pathPoints[Math.max(0, i - 1)];
					const p1 = pathPoints[i];
					const p2 = pathPoints[i + 1];
					const p3 = pathPoints[Math.min(pathPoints.length - 1, i + 2)];
					const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
					const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
					pathD += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
				}
				return pathD;
			};
			const d = pathFromPoints(points);
			squirclePath.setAttribute("d", d);
		}

		new ResizeObserver(drawSquircle).observe(stage);
		</script>
